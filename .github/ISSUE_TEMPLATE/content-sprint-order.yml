name: Content Sprint Order
description: Order a 48h content sprint — 4 drafts + 7-day calendar (intro ¥99 / $29)
title: "[Content Sprint] "
labels: ["content-sprint", "order"]
body:
  - type: markdown
    attributes:
      value: |
        ## 48h Content Sprint — 4 drafts + 7-day calendar

        **Intro price**: **¥99 / $29** (first 5 orders — then ¥199 / $49)  
        **Turnaround**: 48 hours from brief confirmation  
        **Intro orders**: Pay after delivery if you prefer — no payment link required upfront.

        See samples: https://gist.github.com/guofu-ljg/1809247fea3c189d3cbd3b5348422c63

  - type: input
    id: niche
    attributes:
      label: Your niche / domain
      description: e.g. B2B SaaS, indie dev, fitness coaching
      placeholder: B2B SaaS onboarding
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: Target audience
      description: Who reads your content?
      placeholder: product managers at Series A startups
    validations:
      required: true

  - type: checkboxes
    id: formats
    attributes:
      label: Draft formats (pick up to 4)
      options:
        - label: Newsletter (800–1200 words)
        - label: Blog / SEO post (1000–1500 words)
        - label: Twitter/X thread (8–12 tweets)
        - label: 小红书 / short-form (600–900 words)
    validations:
      required: true

  - type: textarea
    id: avoid
    attributes:
      label: Topics to avoid (optional)
      placeholder: competitor names, political topics, etc.

  - type: textarea
    id: references
    attributes:
      label: Reference style links (optional)
      description: 1–3 URLs whose tone you like
      placeholder: https://...

  - type: input
    id: contact
    attributes:
      label: Contact (email or handle)
      description: Where we send delivery + revision link
    validations:
      required: true

  - type: dropdown
    id: payment
    attributes:
      label: Payment preference
      options:
        - Pay after delivery (intro orders OK)
        - I already paid — will attach screenshot in comment
        - Need payment link first
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **What you get**: 7-day calendar (JSON) + 4 Markdown drafts + publish schedule + 1 round minor edits within 24h.

        We'll confirm your brief within 24h and deliver within 48h.
